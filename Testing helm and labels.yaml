### This worked, mostly because the helm chart accept nodeSelector change, and by --set, not a file
helm upgrade --install hello cloudecho/hello -n sis-fat --values env/env_FAT.yaml --set nodeSelector.fat/app=ilgw

### This worked too with a file
helm install hello cloudecho/hello -n sis-fat --values env/env_FAT.yaml
helm install hello cloudecho/hello -n sis-fat -f env/env_FAT.yaml    
env/env_FAT.yaml

!!CAUTION!! deployent must support passing nodeSelector phrase!

